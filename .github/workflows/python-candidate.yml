name: Python docset candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: python-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.13'
          enable-cache: false
      - run: npm ci --ignore-scripts
      # Cache is a performance hint, never proof of successful remote publication.
      # Only compact successful artifacts are cached, not source trees or locks.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .work/python/owner.json
            .work/python/current.json
            .work/python/releases/*/manifest.json
            .work/python/releases/*/validation.json
            .work/python/releases/*/source-lock.json
            .work/python/releases/*/Python.tgz
          key: python-candidate-v2-${{ runner.os }}-${{ hashFiles('src/**', 'package-lock.json', 'recipes/**', 'tools/doc2dash/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            python-candidate-v2-${{ runner.os }}-${{ hashFiles('src/**', 'package-lock.json', 'recipes/**', 'tools/doc2dash/**') }}-
      - name: Build and validate candidate
        id: build
        run: |
          mkdir -p .work
          node src/cli.js build --id python > .work/result.json
          cat .work/result.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(".work/result.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${r.directory}\nstatus=${r.status}\n`);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.build.outputs.status != 'unchanged'
        with:
          name: python-candidate
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ steps.build.outputs.directory }}/Python.tgz
            ${{ steps.build.outputs.directory }}/manifest.json
            ${{ steps.build.outputs.directory }}/validation.json
            ${{ steps.build.outputs.directory }}/source-lock.json

  # Deliberately no contents:write job or speculative public download URLs.
  # A separately configured, independently validating publisher must upload
  # immutable artifacts before creating feeds or committing a release catalog.
